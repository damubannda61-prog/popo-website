
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POPO Reels</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#111;
color:white;
}
header{
position:fixed;top:0;width:100%;
padding:18px;display:flex;
justify-content:space-between;
z-index:5;background:linear-gradient(#0008,transparent);
}
.logo{
font-size:27px;font-weight:900;
background:linear-gradient(45deg,#ff3188,#9945ee);
color:transparent;background-clip:text;
}
.back{color:white;text-decoration:none;font-size:20px}
.feed{
height:100vh;overflow-y:scroll;
scroll-snap-type:y mandatory;
}
.reel{
height:100vh;position:relative;
scroll-snap-align:start;
display:flex;align-items:center;
justify-content:center;
background:linear-gradient(140deg,#5b275b,#c63e8a,#241b44);
}
.reel:nth-child(2){
background:linear-gradient(140deg,#163b56,#713c80,#e05b80);
}
.reel:nth-child(3){
background:linear-gradient(140deg,#26265e,#a13f8d,#e66b75);
}
.video{
width:100%;height:100%;object-fit:cover;
}
.play{
position:absolute;font-size:75px;
opacity:.8;pointer-events:none;
}
.details{
position:absolute;bottom:35px;left:18px;
right:80px;text-shadow:0 2px 8px #000;
}
.details h3{margin-bottom:10px}
.details p{font-size:14px;line-height:1.5}
.follow{
background:linear-gradient(45deg,#ef3287,#963bdc);
border:0;border-radius:20px;
padding:8px 15px;color:white;
margin-left:10px;
}
.actions{
position:absolute;right:15px;
bottom:100px;display:flex;
flex-direction:column;gap:24px;
text-align:center;
}
.actions button{
border:0;background:none;color:white;
font-size:29px;cursor:pointer;
}
.actions small{display:block;font-size:11px}
.active{color:#ff398b!important}
nav{
position:fixed;bottom:0;left:0;
width:100%;height:55px;
display:flex;justify-content:space-around;
align-items:center;background:#111;
z-index:10;
}
nav a{color:white;text-decoration:none;font-size:23px}
@media(min-width:700px){
.feed{width:430px;margin:auto}
}
</style>
</head>
<body>

<header>
<a class="back" href="index.html">←</a>
<div class="logo">▶ POPO</div>
<div>♧</div>
</header>

<main class="feed">

<section class="reel">
<div class="play">▶</div>
<div class="details">
<h3>@popo_official <button class="follow" onclick="follow(this)">Follow</button></h3>
<p>Welcome to POPO Reels! ❤️ #POPO #Reels</p>
<p>♫ Original Audio</p>
</div>
<div class="actions">
<button onclick="like(this)">♡<small>Like</small></button>
<button onclick="comment()">☏<small>Comment</small></button>
<button onclick="share()">➤<small>Share</small></button>
<button onclick="save(this)">♧<small>Save</small></button>
</div>
</section>

<section class="reel">
<div class="play">▶</div>
<div class="details">
<h3>@creator <button class="follow" onclick="follow(this)">Follow</button></h3>
<p>Enjoy your moments with POPO! ✨</p>
<p>♫ Original Audio</p>
</div>
<div class="actions">
<button onclick="like(this)">♡<small>Like</small></button>
<button onclick="comment()">☏<small>Comment</small></button>
<button onclick="share()">➤<small>Share</small></button>
<button onclick="save(this)">♧<small>Save</small></button>
</div>
</section>

<section class="reel">
<div class="play">▶</div>
<div class="details">
<h3>@popo_creator <button class="follow" onclick="follow(this)">Follow</button></h3>
<p>Create. Share. Connect. ❤️</p>
<p>♫ Original Audio</p>
</div>
<div class="actions">
<button onclick="like(this)">♡<small>Like</small></button>
<button onclick="comment()">☏<small>Comment</small></button>
<button onclick="share()">➤<small>Share</small></button>
<button onclick="save(this)">♧<small>Save</small></button>
</div>
</section>

</main>

<nav>
<a href="index.html">⌂</a>
<a href="reels.html">▷</a>
<a href="create.html">＋</a>
<a href="videos.html">▣</a>
<a href="profile.html">♙</a>
</nav>

<script>
function like(btn){
btn.classList.toggle("active");
btn.innerHTML=btn.classList.contains("active")
?"♥<small>Liked</small>"
:"♡<small>Like</small>";
}
function save(btn){
btn.classList.toggle("active");
alert(btn.classList.contains("active")?"Saved":"Removed");
}
function follow(btn){
btn.textContent=btn.textContent==="Follow"?"Following":"Follow";
}
function comment(){
alert("Comments screen will be connected next.");
}
async function share(){
if(navigator.share){
await navigator.share({title:"POPO Reels",text:"Watch POPO Reels!"});
}else{
alert("Sharing is not supported.");
}
}
</script>
</body>
</html>
