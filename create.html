
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POPO Create</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#faf8fc;color:#25212a}
header{
height:65px;background:white;border-bottom:1px solid #eee;
display:flex;align-items:center;justify-content:space-between;
padding:0 6%
}
.logo{
font-size:29px;font-weight:900;
background:linear-gradient(45deg,#ed267b,#8437dc);
background-clip:text;color:transparent
}
.back{text-decoration:none;color:#333;font-size:20px}
main{max-width:850px;margin:35px auto;padding:15px}
h1{text-align:center;font-size:28px}
.subtitle{text-align:center;color:#888;margin:12px 0 30px}
.grid{
display:grid;grid-template-columns:repeat(2,1fr);gap:18px
}
.option{
background:white;border:1px solid #eee;
border-radius:20px;padding:25px 15px;
text-align:center;cursor:pointer;
transition:.2s
}
.option:active{transform:scale(.97)}
.option .emoji{font-size:42px;margin-bottom:15px}
.option h3{font-size:17px;margin-bottom:8px}
.option p{font-size:13px;color:#888}
button{
border:0;cursor:pointer
}
.preview{
background:white;border-radius:20px;
padding:22px;margin-top:25px;
display:none
}
.preview h2{margin-bottom:15px}
.preview input,.preview textarea{
width:100%;padding:13px;border:1px solid #ddd;
border-radius:10px;margin:8px 0;font:inherit
}
.preview textarea{min-height:90px;resize:vertical}
.preview button{
background:linear-gradient(45deg,#ed267b,#8437dc);
color:white;padding:13px 22px;
border-radius:25px;margin-top:12px
}
.preview img,.preview video{
width:100%;max-height:300px;
object-fit:contain;margin-top:12px
}
nav{
position:fixed;bottom:0;width:100%;height:60px;
display:flex;justify-content:space-around;
align-items:center;background:white;border-top:1px solid #eee
}
nav a{font-size:23px;color:#333;text-decoration:none}
@media(max-width:550px){
.grid{grid-template-columns:1fr}
main{margin:15px auto 80px}
}
</style>
</head>
<body>
<header>
<a href="index.html" class="back">←</a>
<div class="logo">▶ POPO</div>
<div>＋</div>
</header>

<main>
<h1>Create Something Amazing ✨</h1>
<p class="subtitle">Share your creativity with the POPO community.</p>

<div class="grid">
<button class="option" onclick="openUpload('reel')">
<div class="emoji">🎬</div>
<h3>Upload Reels</h3>
<p>Share short vertical videos</p>
</button>

<button class="option" onclick="openCamera()">
<div class="emoji">📹</div>
<h3>Record Reels</h3>
<p>Record with your camera</p>
</button>

<button class="option" onclick="openUpload('video')">
<div class="emoji">▶️</div>
<h3>Upload Long Video</h3>
<p>Share longer videos</p>
</button>

<button class="option" onclick="openUpload('photo')">
<div class="emoji">📸</div>
<h3>Upload Photo</h3>
<p>Share beautiful pictures</p>
</button>

<button class="option" onclick="openUpload('story')">
<div class="emoji">⭕</div>
<h3>Create Story</h3>
<p>Share a 24-hour story</p>
</button>

<button class="option" onclick="goLive()">
<div class="emoji">🔴</div>
<h3>Go Live</h3>
<p>Start a live broadcast</p>
</button>
</div>

<section class="preview" id="preview">
<h2 id="formTitle">Upload Media</h2>
<form id="uploadForm">
<input type="file" id="media" accept="image/*,video/*" required>
<input type="text" id="title" placeholder="Title or caption">
<textarea id="description" placeholder="Write something..."></textarea>
<div id="filePreview"></div>
<button type="submit">Preview Selection</button>
</form>
<p id="status" style="margin-top:12px;color:#777"></p>
</section>
</main>

<nav>
<a href="index.html">⌂</a>
<a href="reels.html">▷</a>
<a href="create.html">＋</a>
<a href="videos.html">▣</a>
<a href="profile.html">♙</a>
</nav>

<script>
let currentType="";

function openUpload(type){
currentType=type;
const titles={
reel:"Upload Reels",
video:"Upload Long Video",
photo:"Upload Photo",
story:"Create Story"
};
document.getElementById("formTitle").textContent=titles[type];
document.getElementById("preview").style.display="block";
document.getElementById("status").textContent="";
document.getElementById("filePreview").innerHTML="";
document.getElementById("media").value="";
document.getElementById("media").accept=
type==="photo"?"image/*":
type==="story"?"image/*,video/*":"video/*";
document.getElementById("preview").scrollIntoView({behavior:"smooth"});
}

document.getElementById("media").addEventListener("change",function(){
const file=this.files[0];
if(!file)return;
const url=URL.createObjectURL(file);
const element=document.createElement(
file.type.startsWith("image/")?"img":"video"
);
element.src=url;
if(element.tagName==="VIDEO")element.controls=true;
const box=document.getElementById("filePreview");
box.innerHTML="";
box.appendChild(element);
});

document.getElementById("uploadForm").addEventListener("submit",function(e){
e.preventDefault();
const file=document.getElementById("media").files[0];
if(!file)return;
document.getElementById("status").textContent=
"Preview ready: "+file.name+". Actual publishing will be connected to Firebase backend.";
});

function openCamera(){
const input=document.createElement("input");
input.type="file";
input.accept="video/*";
input.capture="user";
input.onchange=()=>{
if(input.files.length){
openUpload("reel");
const dt=new DataTransfer();
dt.items.add(input.files[0]);
document.getElementById("media").files=dt.files;
document.getElementById("media").dispatchEvent(new Event("change"));
}
};
input.click();
}

function goLive(){
alert("Live streaming will be enabled after the video streaming backend is connected.");
}
</script>
</body>
</html>
